name: devpill.me CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build:
    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out project
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run checks
      run: bun run test

    - name: Build production website
      run: bun run build
